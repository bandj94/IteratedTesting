[[task]]
id = "bf07"
entry = "flatten"
code = '''
def flatten(nested):
    """Flatten arbitrarily nested lists and tuples into one flat list, keeping the order.
    Anything that is not a list or tuple (strings, bytes, dicts, sets, ...) is a single item."""
    out = []
    for item in nested:
        if hasattr(item, "__iter__"):
            out.extend(flatten(item))
        else:
            out.append(item)
    return out
'''
reference = '''
def flatten(nested):
    """Flatten arbitrarily nested lists and tuples into one flat list, keeping the order.
    Anything that is not a list or tuple (strings, bytes, dicts, sets, ...) is a single item."""
    out = []
    for item in nested:
        if isinstance(item, (list, tuple)):
            out.extend(flatten(item))
        else:
            out.append(item)
    return out
'''
