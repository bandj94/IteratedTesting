id = "fcg05"
entry = "spiral_fill"
prompt = '''
Write a Python function `spiral_fill(rows: int, cols: int, clockwise: bool = True) -> list[list[int]]`.

Fill a rows x cols grid with the numbers 1 to rows*cols along a spiral that starts in the top-left cell and winds inward. When `clockwise` is True the first move is to the right; when it is False the first move is down (counter-clockwise). rows and cols are at least 1.

Examples:
spiral_fill(3, 3) == [[1, 2, 3], [8, 9, 4], [7, 6, 5]]
spiral_fill(3, 3, clockwise=False) == [[1, 8, 7], [2, 9, 6], [3, 4, 5]]
'''
reference = '''
def spiral_fill(rows, cols, clockwise=True):
    grid = [[0] * cols for _ in range(rows)]
    dirs = [(0, 1), (1, 0), (0, -1), (-1, 0)] if clockwise else [(1, 0), (0, 1), (-1, 0), (0, -1)]
    r = c = d = 0
    for k in range(1, rows * cols + 1):
        grid[r][c] = k
        dr, dc = dirs[d]
        nr, nc = r + dr, c + dc
        if not (0 <= nr < rows and 0 <= nc < cols and grid[nr][nc] == 0):
            d = (d + 1) % 4
            dr, dc = dirs[d]
            nr, nc = r + dr, c + dc
        r, c = nr, nc
    return grid
'''
tests = '''
