check(lambda: assign_rooms([("m1", 0, 10), ("m2", 0, 5), ("m3", 5, 8), ("m4", 9, 12), ("m5", 10, 11)]), {"m1": 1, "m2": 2, "m3": 2, "m4": 2, "m5": 1})
