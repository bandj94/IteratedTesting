Write a Python function `parse_csv_line(line: str) -> list[str]`.

Fields are separated by commas. A field may be enclosed in double quotes; inside a quoted field, commas and newlines are literal and a doubled quote "" stands for one ". Quotes only have this meaning when the field starts with a quote: a quote anywhere inside an unquoted field is kept as a literal character. Whitespace is never trimmed.

Raise ValueError if a quoted field is not closed, or if a closing quote is followed by anything other than a comma or the end of the line.

An empty line is a single empty field: parse_csv_line("") == [""].

Examples:
parse_csv_line('a,"b,c",d') == ["a", "b,c", "d"]
parse_csv_line('"say ""hi""",x') == ['say "hi"', "x"]
parse_csv_line('ab"c,d') == ['ab"c', "d"]
'''
reference = '''
def parse_csv_line(line):
    fields = []
    i, n = 0, len(line)
    while True:
        if i < n and line[i] == '"':
            i += 1
            buf = []
            while True:
                if i >= n:
                    raise ValueError("unclosed quote")
                ch = line[i]
                if ch == '"':
                    if i + 1 < n and line[i + 1] == '"':
                        buf.append('"')
                        i += 2
                        continue
                    i += 1
                    break
                buf.append(ch)
                i += 1
            fields.append("".join(buf))
            if i == n:
                return fields
            if line[i] != ",":
                raise ValueError("unexpected character after a closing quote")
            i += 1
        else:
            j = line.find(",", i)
            if j == -1:
                fields.append(line[i:])
                return fields
            fields.append(line[i:j])
            i = j + 1
'''
