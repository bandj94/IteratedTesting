entry = "days_in_month"
code = '''
def days_in_month(year, month):
    """Return the number of days in the given month (1-12) of the given year in the Gregorian calendar.
    Raise ValueError for a month outside 1-12."""
    if month == 2:
        return 29 if year % 4 == 0 else 28
    if month in (4, 6, 9, 11):
        return 30
    return 31
'''
reference = '''
def days_in_month(year, month):
    """Return the number of days in the given month (1-12) of the given year in the Gregorian calendar.
    Raise ValueError for a month outside 1-12."""
    if not 1 <= month <= 12:
        raise ValueError("month must be 1-12")
    if month == 2:
        leap = year % 4 == 0 and (year % 100 != 0 or year % 400 == 0)
        return 29 if leap else 28
    return 30 if month in (4, 6, 9, 11) else 31
'''
