[[task]]
id = "cg01"
entry = "parse_duration"
prompt = '''
Write a Python function `parse_duration(text: str) -> int` that converts a compact duration string into a number of seconds.

Rules:
- The string is one or more `<number><unit>` parts with no spaces, for example "1h30m", "45s", "2d" or "1d2h3m4s".
- Units are `d` (86400 seconds), `h` (3600), `m` (60) and `s` (1). Units are lowercase.
- Each unit may appear at most once, and units must appear in the order d, h, m, s ("1m1h" is invalid).
- Numbers are non-negative integers written with the digits 0-9 only (no sign, no decimal point). Leading zeros are allowed ("05m" is 300).
- Raise `ValueError` for anything that does not follow these rules, including the empty string, unknown units, a number without a unit, a unit without a number, and any whitespace.

Examples:
parse_duration("1h30m") == 5400
parse_duration("2d") == 172800
parse_duration("0s") == 0
'''
reference = '''
import re

def parse_duration(text):
    if not isinstance(text, str) or not text:
        raise ValueError("empty duration")
    m = re.fullmatch(r"(?:([0-9]+)d)?(?:([0-9]+)h)?(?:([0-9]+)m)?(?:([0-9]+)s)?", text)
    if not m or not any(m.groups()):
        raise ValueError("invalid duration: %r" % text)
    total = 0
    for value, size in zip(m.groups(), (86400, 3600, 60, 1)):
        if value is not None:
            total += int(value) * size
    return total
'''
tests = '''
check(lambda: parse_duration("1h30m"), 5400)
check(lambda: parse_duration("45s"), 45)
check(lambda: parse_duration("2d"), 172800)
check(lambda: parse_duration("1d2h3m4s"), 93784)
check(lambda: parse_duration("90m"), 5400)
check(lambda: parse_duration("0s"), 0)
check(lambda: parse_duration("05m"), 300)
check(lambda: parse_duration("3h4s"), 10804)
check(lambda: parse_duration("100000s"), 100000)
for bad in ["", "1x", "1m1h", "1h1h", "h", "1.5h", "-1h", "1h 30m", " 1h", "10", "1H", "1h30", "d1"]:
    check_raises((lambda b=bad: parse_duration(b)), ValueError, label=repr(bad))
'''

[[task]]
id = "cg02"
entry = "compress_ranges"
lite = true
prompt = '''
Write a Python function `compress_ranges(nums: list[int]) -> str`.

Sort the distinct values of `nums` and describe them compactly:
- A run of three or more consecutive integers is written as `start-end`.
- Values that are not part of such a run (including runs of exactly two) are written individually.
- Items are joined with commas and no spaces.
- Negative numbers keep their minus sign, so the run -3, -2, -1 is written "-3--1".
- An empty list gives "".

Examples:
compress_ranges([1, 2, 3, 5, 6, 8, 9, 10, 11]) == "1-3,5,6,8-11"
compress_ranges([4, 4, 2]) == "2,4"
'''
reference = '''
def compress_ranges(nums):
    vals = sorted(set(nums))
    out, i = [], 0
    while i < len(vals):
        j = i
        while j + 1 < len(vals) and vals[j + 1] == vals[j] + 1:
            j += 1
        if j - i >= 2:
            out.append("%d-%d" % (vals[i], vals[j]))
        else:
            out.extend(str(v) for v in vals[i:j + 1])
        i = j + 1
    return ",".join(out)
'''
tests = '''
