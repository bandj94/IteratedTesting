prompt = '''
Write a Python function `merge_with_gap(intervals: list[tuple[int, int]], max_gap: int) -> list[tuple[int, int]]`.

Each interval is a closed interval (start, end) with start <= end. Sort the intervals and merge any two whose gap is at most max_gap, where the gap between [a, b] and a later-starting [c, d] is c - b (overlapping intervals have a gap of zero or less and always merge). Return the merged intervals as tuples sorted by start. max_gap >= 0. Raise ValueError if any interval has start > end.

Examples:
merge_with_gap([(1, 3), (6, 8), (4, 5)], 1) == [(1, 8)]
merge_with_gap([(1, 3), (6, 8)], 1) == [(1, 3), (6, 8)]
'''
reference = '''
def merge_with_gap(intervals, max_gap):
    for s, e in intervals:
        if s > e:
            raise ValueError("start > end")
    out = []
    for s, e in sorted(intervals):
        if out and s - out[-1][1] <= max_gap:
            out[-1] = (out[-1][0], max(out[-1][1], e))
        else:
            out.append((s, e))
    return out
'''
