[[task]]
id = "fcg03"
entry = "topo_order"
prompt = '''
Write a Python function `topo_order(deps: dict[str, list[str]]) -> list[str]`.

`deps[x]` lists the tasks that must come before task x. Every task that appears anywhere (as a key or inside a list) must be in the result. Return an order that respects all dependencies; whenever several tasks are ready, take the alphabetically smallest one first. Raise ValueError if the dependencies contain a cycle (including a task that depends on itself).

Example:
topo_order({"b": ["a"], "c": ["a"], "a": []}) == ["a", "b", "c"]
'''
reference = '''
import heapq

def topo_order(deps):
    nodes = set(deps)
    for ds in deps.values():
        nodes.update(ds)
    indeg = {n: 0 for n in nodes}
    children = {n: set() for n in nodes}
    for n, ds in deps.items():
        for d in set(ds):
            if d == n:
                raise ValueError("%s depends on itself" % n)
            children[d].add(n)
            indeg[n] += 1
    heap = [n for n in nodes if indeg[n] == 0]
    heapq.heapify(heap)
    out = []
    while heap:
        n = heapq.heappop(heap)
        out.append(n)
        for c in children[n]:
            indeg[c] -= 1
            if indeg[c] == 0:
                heapq.heappush(heap, c)
    if len(out) != len(nodes):
        raise ValueError("cycle")
    return out
'''
tests = '''
check(lambda: topo_order({"b": ["a"], "c": ["a"], "a": []}), ["a", "b", "c"])
check(lambda: topo_order({}), [])
check(lambda: topo_order({"z": []}), ["z"])
check(lambda: topo_order({"c": ["b"], "b": ["a"]}), ["a", "b", "c"])
check(lambda: topo_order({"d": ["b", "c"], "b": ["a"], "c": ["a"]}), ["a", "b", "c", "d"])
check(lambda: topo_order({"x": ["y"], "a": []}), ["a", "y", "x"])
check(lambda: topo_order({"b": [], "a": ["c"], "c": []}), ["b", "c", "a"])
check(lambda: topo_order({"m": ["k", "k"], "k": []}), ["k", "m"])
check_raises(lambda: topo_order({"a": ["b"], "b": ["a"]}), ValueError)
check_raises(lambda: topo_order({"a": ["a"]}), ValueError)
check_raises(lambda: topo_order({"a": ["b"], "b": ["c"], "c": ["a"], "d": []}), ValueError)
'''

