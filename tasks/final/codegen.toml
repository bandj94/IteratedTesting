prompt = '''
Write a Python function `longest_balanced(s: str) -> tuple[int, int]`.

`s` consists only of the characters "a" and "b". Find the longest contiguous substring that has as many "a"s as "b"s and return (start, length). If several have the maximum length, return the one with the smallest start. If there is none (including when s is empty), return (0, 0). s can be up to 100000 characters long, so the solution must run in about linear time.

Example:
longest_balanced("aabab") == (1, 4)
'''
reference = '''
def longest_balanced(s):
    first = {0: 0}
    bal = 0
    best = (0, 0)
    for i, ch in enumerate(s, 1):
        bal += 1 if ch == "a" else -1
        if bal in first:
            length = i - first[bal]
            if length > best[1]:
                best = (first[bal], length)
        else:
            first[bal] = i
    return best
'''
tests = '''
import random as _random

def _ref(s):
    for length in range(len(s) - len(s) % 2, 0, -2):
        for i in range(len(s) - length + 1):
            part = s[i:i + length]
            if part.count("a") == part.count("b"):
                return (i, length)
    return (0, 0)

check(lambda: longest_balanced("aabab"), (1, 4))
