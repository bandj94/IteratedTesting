code = '''
def title_case(text, minor_words):
    """Capitalize each word of `text` (words are separated by single spaces), except words found in
    `minor_words` (compared case-insensitively), which are written in lowercase. The first and last
    words are always capitalized; for a hyphenated first or last word, all of its parts are.
    Parts of hyphenated words are handled separately ("well-known" -> "Well-Known"), and the
    minor-word rule applies to each part. Capitalizing means upper-casing the first character and
    lower-casing the rest."""
    words = text.split(" ")
    out = []
    for w in words:
        if w in minor_words:
            out.append(w.lower())
        else:
            out.append(w.capitalize())
    return " ".join(out)
'''
reference = '''
def title_case(text, minor_words):
    minor = {w.lower() for w in minor_words}
    words = text.split(" ")
    out = []
    for i, word in enumerate(words):
        edge = i == 0 or i == len(words) - 1
        parts = []
        for part in word.split("-"):
            if not edge and part.lower() in minor:
                parts.append(part.lower())
            else:
                parts.append(part[:1].upper() + part[1:].lower())
        out.append("-".join(parts))
    return " ".join(out)
'''
tests = '''
check(lambda: title_case("the lord of the rings", {"of", "the"}), "The Lord of the Rings")
check(lambda: title_case("A TALE OF two cities", {"of", "a"}), "A Tale of Two Cities")
check(lambda: title_case("war and peace", {"AND"}), "War and Peace")
check(lambda: title_case("what it is about", {"about", "it"}), "What it Is About")
check(lambda: title_case("a well-known fact", {"a"}), "A Well-Known Fact")
check(lambda: title_case("a state-of-the-art design", {"of", "the", "a"}), "A State-of-the-Art Design")
check(lambda: title_case("of-the mice", {"of", "the"}), "Of-The Mice")
check(lambda: title_case("x", {"x"}), "X")
check(lambda: title_case("mcDONALD's story", set()), "Mcdonald's Story")
'''

