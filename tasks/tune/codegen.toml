prompt = '''
Write a Python function `best_knapsack(items: list[tuple[str, int, int]], capacity: int) -> list[str]`.

Each item is (name, weight, value) with a unique name, weight >= 1 and value >= 0. Choose a subset with total weight <= capacity that maximizes the total value. If several subsets reach the maximum value, prefer the one with the smallest total weight; if still tied, prefer the one whose sorted list of names is smallest when the sorted name lists are compared as Python lists.

Return the chosen names sorted alphabetically. There are at most 16 items.

Example:
best_knapsack([("a", 3, 4), ("b", 2, 3), ("c", 2, 3)], 4) == ["b", "c"]
'''
reference = '''
def best_knapsack(items, capacity):
    best_key, best = None, []
    n = len(items)
    for mask in range(1 << n):
        weight = value = 0
        names = []
        for i in range(n):
            if mask >> i & 1:
                name, w, v = items[i]
                weight += w
                value += v
                names.append(name)
        if weight > capacity:
            continue
        names.sort()
        key = (-value, weight, names)
        if best_key is None or key < best_key:
            best_key, best = key, names
    return best
'''
