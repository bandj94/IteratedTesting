def apply_discount(price_cents, percent):
    """Return the price in cents after taking `percent` percent off (percent is an int from 0 to 100,
    price_cents is a non-negative int). Round to the nearest cent; exact halves round up."""
    return int(price_cents * (100 - percent) / 100)
'''
