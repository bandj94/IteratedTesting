[[task]]
id = "cg15"
entry = "calc"
lite = true
prompt = '''
Write a Python function `calc(expr: str) -> fractions.Fraction` that evaluates an arithmetic expression exactly.

Grammar: non-negative integer literals, binary + - * / ^, unary minus, and parentheses. Spaces may appear between tokens.
- ^ is exponentiation. It is right-associative (2^3^2 = 2^9 = 512) and binds tighter than unary minus (-2^2 = -4), but its right operand may itself start with a unary minus (2^-1 = 1/2).
- Unary minus binds tighter than * and /, so -3*2 = -6 and 2*-3 = -6.
- / is exact division.
- The exponent must evaluate to an integer; otherwise raise ValueError.

Raise ZeroDivisionError when dividing by zero (including 0 raised to a negative power), and ValueError for any syntax error (empty input, unbalanced parentheses, bad characters, missing operands, two numbers in a row). Always return a fractions.Fraction (an integer result is Fraction(n, 1)).

Examples:
calc("1 + 2 * 3") == Fraction(7)
calc("(1 + 2) / 4") == Fraction(3, 4)
calc("-2^2") == Fraction(-4)
calc("2^3^2") == Fraction(512)
'''
reference = '''
from fractions import Fraction

def calc(expr):
    tokens, i = [], 0
    while i < len(expr):
        ch = expr[i]
        if ch.isspace():
            i += 1
        elif ch in "0123456789":
            j = i
            while j < len(expr) and expr[j] in "0123456789":
                j += 1
            tokens.append(("num", int(expr[i:j])))
            i = j
        elif ch in "+-*/^()":
            tokens.append(("op", ch))
            i += 1
        else:
            raise ValueError("bad character %r" % ch)
    pos = 0

    def peek():
        return tokens[pos] if pos < len(tokens) else None

    def take(op=None):
        nonlocal pos
        tok = peek()
        if tok is None or (op is not None and tok != ("op", op)):
            raise ValueError("syntax error")
        pos += 1
        return tok

    def expression():
        value = term()
        while peek() in (("op", "+"), ("op", "-")):
            op = take()[1]
            rhs = term()
            value = value + rhs if op == "+" else value - rhs
        return value

    def term():
        value = unary()
        while peek() in (("op", "*"), ("op", "/")):
            op = take()[1]
            rhs = unary()
            if op == "*":
                value = value * rhs
            else:
                if rhs == 0:
                    raise ZeroDivisionError("division by zero")
                value = value / rhs
        return value

    def unary():
        if peek() == ("op", "-"):
            take()
            return -unary()
        return power()

    def power():
        base = atom()
        if peek() == ("op", "^"):
            take()
            exp = unary()
            if exp.denominator != 1:
                raise ValueError("non-integer exponent")
            if base == 0 and exp < 0:
                raise ZeroDivisionError("zero to a negative power")
            return base ** int(exp)
        return base

    def atom():
        tok = peek()
        if tok is None:
            raise ValueError("unexpected end of input")
        if tok[0] == "num":
            take()
            return Fraction(tok[1])
        if tok == ("op", "("):
            take()
            value = expression()
            take(")")
            return value
        raise ValueError("syntax error")

    result = expression()
    if pos != len(tokens):
        raise ValueError("unexpected trailing input")
    return Fraction(result)
'''
tests = '''
from fractions import Fraction as F
check(lambda: calc("1 + 2 * 3"), F(7))
check(lambda: calc("(1 + 2) / 4"), F(3, 4))
check(lambda: calc("-2^2"), F(-4))
check(lambda: calc("(-2)^2"), F(4))
check(lambda: calc("2^3^2"), F(512))
check(lambda: calc("2^-1"), F(1, 2))
check(lambda: calc("2*-3"), F(-6))
check(lambda: calc("--3"), F(3))
check(lambda: calc("1/3 + 1/6"), F(1, 2))
check(lambda: calc(" 7 - 2 - 1 "), F(4))
check(lambda: calc("8 / 2 / 2"), F(2))
check(lambda: calc("(2/3)^2"), F(4, 9))
check(lambda: calc("2^(1+1)^2"), F(16))
check(lambda: calc("((((5))))"), F(5))
check(lambda: calc("10 - -2"), F(12))
check(lambda: type(calc("2+2")) is F, True)
check_raises(lambda: calc("4^(1/2)"), ValueError)
check_raises(lambda: calc("1/0"), ZeroDivisionError)
check_raises(lambda: calc("0^-1"), ZeroDivisionError)
check_raises(lambda: calc(""), ValueError)
check_raises(lambda: calc("(1+2"), ValueError)
check_raises(lambda: calc("1+"), ValueError)
check_raises(lambda: calc("2 3"), ValueError)
check_raises(lambda: calc("1 + a"), ValueError)
check_raises(lambda: calc(")("), ValueError)
'''

