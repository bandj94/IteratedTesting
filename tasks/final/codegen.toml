[[task]]
id = "fcg11"
entry = ["encode_sint", "decode_sint"]
prompt = '''
Write two Python functions, `encode_sint(n: int) -> bytes` and `decode_sint(data: bytes) -> int`, for signed integers.

Encoding: first map n with ZigZag (0 -> 0, -1 -> 1, 1 -> 2, -2 -> 3, 2 -> 4, ...; that is 2n for n >= 0 and -2n - 1 for n < 0), then write the result as an unsigned LEB128 varint: 7 bits per byte, least significant group first, with the high bit (0x80) set on every byte except the last.

decode_sint reverses this. Raise ValueError if `data` is empty, if the last byte still has its high bit set (truncated input), or if there are extra bytes after the varint ends. Python integers can be arbitrarily large; support them.

Examples:
encode_sint(0) == b"\x00"
encode_sint(-1) == b"\x01"
encode_sint(64) == b"\x80\x01"
decode_sint(b"\x80\x01") == 64
'''
reference = '''
def encode_sint(n):
    z = 2 * n if n >= 0 else -2 * n - 1
    out = bytearray()
    while True:
        b = z & 0x7F
        z >>= 7
        if z:
            out.append(b | 0x80)
        else:
            out.append(b)
            return bytes(out)

def decode_sint(data):
    if not data:
        raise ValueError("empty input")
    z = 0
    for i, b in enumerate(data):
        z |= (b & 0x7F) << (7 * i)
        if not b & 0x80:
            if i != len(data) - 1:
                raise ValueError("extra bytes after the varint")
            return z >> 1 if z % 2 == 0 else -((z + 1) >> 1)
    raise ValueError("truncated varint")
'''
tests = '''
check(lambda: encode_sint(0), b"\x00")
check(lambda: encode_sint(-1), b"\x01")
check(lambda: encode_sint(1), b"\x02")
check(lambda: encode_sint(-64), b"\x7f")
check(lambda: encode_sint(64), b"\x80\x01")
check(lambda: encode_sint(-65), b"\x81\x01")
check(lambda: encode_sint(2**63), b"\x80\x80\x80\x80\x80\x80\x80\x80\x80\x02")
check(lambda: decode_sint(b"\x80\x01"), 64)
check(lambda: decode_sint(b"\x7f"), -64)
check(lambda: decode_sint(b"\x81\x01"), -65)
check(lambda: all(decode_sint(encode_sint(v)) == v for v in [0, 1, -1, 300, -300, 2**31, -2**31, 2**63, -(2**63) - 1, 10**30, -(10**30)]), True)
check_raises(lambda: decode_sint(b""), ValueError)
check_raises(lambda: decode_sint(b"\x80"), ValueError)
check_raises(lambda: decode_sint(b"\x01\x00"), ValueError)
'''

