check(lambda: dedupe([]), [])
check(lambda: dedupe([[1], [2], [1]]), [[1], [2]])
check(lambda: dedupe([{"a": 1}, {"a": 1}, {"b": 2}]), [{"a": 1}, {"b": 2}])
check(lambda: dedupe([1, True, 1.0, "1"]), [1, "1"])
check(lambda: dedupe(["b", "a", "b", "c", "a"]), ["b", "a", "c"])
check(lambda: dedupe([[1, 2], (1, 2), [1, 2]]), [[1, 2], (1, 2)])
check(lambda: dedupe([None, None, 0, False]), [None, 0])
check(lambda: (lambda l: dedupe(l) is not l)([1, 2]), True)
