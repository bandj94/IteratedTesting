[[task]]
id = "bf04"
entry = "parse_query"
code = '''
def parse_query(qs):
    """Parse a URL query string such as "a=1&b=two%20words&c" into a dict.
    - Pairs are separated by "&"; empty pairs are ignored.
    - Each pair is split at the FIRST "=" only; a pair without "=" gets the value "".
    - Keys and values are percent-decoded, and "+" means a space.
    - If a key repeats, the last value wins."""
    result = {}
    for pair in qs.split("&"):
        key, value = pair.split("=")
        result[key] = value
    return result
'''
reference = '''
from urllib.parse import unquote_plus

def parse_query(qs):
    """Parse a URL query string such as "a=1&b=two%20words&c" into a dict."""
    result = {}
    for pair in qs.split("&"):
        if not pair:
            continue
        key, _, value = pair.partition("=")
        result[unquote_plus(key)] = unquote_plus(value)
    return result
'''
tests = '''
check(lambda: parse_query("a=1&b=two%20words&c"), {"a": "1", "b": "two words", "c": ""})
check(lambda: parse_query(""), {})
check(lambda: parse_query("x=1=2"), {"x": "1=2"})
check(lambda: parse_query("q=a+b%2Bc"), {"q": "a b+c"})
check(lambda: parse_query("&&k=v&"), {"k": "v"})
check(lambda: parse_query("k=1&k=2"), {"k": "2"})
check(lambda: parse_query("na%6De=%E2%9C%93"), {"name": "✓"})
check(lambda: parse_query("empty="), {"empty": ""})
check(lambda: parse_query("a%26b=c%3Dd"), {"a&b": "c=d"})
'''

