Write a Python function `natural_sort(names: list[str]) -> list[str]` that returns a new list in "natural" order.

Split each string into runs of ASCII digits (0-9) and runs of other characters. Compare two strings run by run:
- two digit runs compare by numeric value;
- two non-digit runs compare case-insensitively (using str.lower());
- a digit run sorts before a non-digit run;
- if one string's runs are a prefix of the other's, the shorter one comes first.
If two strings are still equal under these rules (for example "a01" and "a1", or "A" and "a"), order them by plain string comparison (`<`).

Example:
natural_sort(["file10.txt", "file2.txt", "File1.txt"]) == ["File1.txt", "file2.txt", "file10.txt"]
'''
reference = '''
import re

def natural_sort(names):
    def key(s):
        runs = []
        for part in re.findall(r"[0-9]+|[^0-9]+", s):
            if part[0] in "0123456789":
                runs.append((0, int(part), ""))
            else:
                runs.append((1, 0, part.lower()))
        return (runs, s)
    return sorted(names, key=key)
'''
tests = '''
check(lambda: natural_sort(["file10.txt", "file2.txt", "File1.txt"]), ["File1.txt", "file2.txt", "file10.txt"])
check(lambda: natural_sort([]), [])
check(lambda: natural_sort(["a1", "a01", "a"]), ["a", "a01", "a1"])
check(lambda: natural_sort(["b", "A", "a", "B"]), ["A", "a", "B", "b"])
check(lambda: natural_sort(["x2y10", "x2y9", "x10y1"]), ["x2y9", "x2y10", "x10y1"])
check(lambda: natural_sort(["10", "9", "1a", "1"]), ["1", "1a", "9", "10"])
check(lambda: natural_sort(["a-2", "a-10", "a-1"]), ["a-1", "a-2", "a-10"])
check(lambda: natural_sort(["img12.png", "img10.png", "IMG2.png", "img2.png"]), ["IMG2.png", "img2.png", "img10.png", "img12.png"])
check(lambda: natural_sort(["1x", "x1"]), ["1x", "x1"])
check(lambda: natural_sort(["v1.10", "v1.9", "v1.9.1"]), ["v1.9", "v1.9.1", "v1.10"])
check(lambda: (lambda l: natural_sort(l) is not l)(["b", "a"]), True)
'''

