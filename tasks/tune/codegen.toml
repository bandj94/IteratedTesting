id = "cg07"
entry = "split_balanced"
prompt = '''
Write a Python function `split_balanced(s: str) -> list[str]`.

`s` contains only the characters ()[]{}. If `s` is correctly nested (every opener is closed by the matching closer, in the right order), split it into the largest possible number of non-empty contiguous pieces that are each correctly nested, and return the pieces in order. If `s` is not correctly nested, return []. The empty string returns [].

Examples:
split_balanced("()[]{()}") == ["()", "[]", "{()}"]
split_balanced("([)]") == []
'''
reference = '''
def split_balanced(s):
    pairs = {")": "(", "]": "[", "}": "{"}
    stack, pieces, start = [], [], 0
    for i, ch in enumerate(s):
        if ch in "([{":
            stack.append(ch)
        elif ch in pairs:
            if not stack or stack[-1] != pairs[ch]:
                return []
            stack.pop()
            if not stack:
                pieces.append(s[start:i + 1])
                start = i + 1
        else:
            return []
    return pieces if not stack else []
'''
tests = '''
check(lambda: split_balanced("()[]{()}"), ["()", "[]", "{()}"])
check(lambda: split_balanced("([)]"), [])
check(lambda: split_balanced(""), [])
check(lambda: split_balanced("(())"), ["(())"])
check(lambda: split_balanced("(()())[]"), ["(()())", "[]"])
check(lambda: split_balanced("((("), [])
check(lambda: split_balanced(")("), [])
check(lambda: split_balanced("{[()()]}()"), ["{[()()]}", "()"])
check(lambda: split_balanced("()()()"), ["()", "()", "()"])
check(lambda: split_balanced("(]"), [])
check(lambda: split_balanced("[{}](())"), ["[{}]", "(())"])
check(lambda: split_balanced("()("), [])
'''

[[task]]
id = "cg08"
entry = "roman_to_int"
prompt = '''
Write a Python function `roman_to_int(s: str) -> int` for Roman numerals from 1 to 3999.

Only canonical (standard modern) numerals are valid: symbols I=1, V=5, X=10, L=50, C=100, D=500, M=1000, written from largest to smallest, using the subtractive pairs IV, IX, XL, XC, CD and CM, and never repeating a symbol more than three times in a row (4 is "IV", not "IIII"; 99 is "XCIX", not "IC"). The input must be uppercase.

Raise ValueError for anything that is not the canonical numeral of a number from 1 to 3999, including the empty string.

Examples:
roman_to_int("MCMXCIV") == 1994
roman_to_int("IIII") raises ValueError
'''
reference = '''
_TABLE = [(1000, "M"), (900, "CM"), (500, "D"), (400, "CD"), (100, "C"), (90, "XC"), (50, "L"),
          (40, "XL"), (10, "X"), (9, "IX"), (5, "V"), (4, "IV"), (1, "I")]

def _to_roman(n):
    out = []
    for value, sym in _TABLE:
        while n >= value:
            out.append(sym)
            n -= value
    return "".join(out)

def roman_to_int(s):
    values = {"I": 1, "V": 5, "X": 10, "L": 50, "C": 100, "D": 500, "M": 1000}
    if not isinstance(s, str) or not s:
        raise ValueError("empty numeral")
    total = 0
    for i, ch in enumerate(s):
        if ch not in values:
            raise ValueError("bad symbol %r" % ch)
        v = values[ch]
        if i + 1 < len(s) and values.get(s[i + 1], 0) > v:
            total -= v
        else:
            total += v
    if not 1 <= total <= 3999 or _to_roman(total) != s:
        raise ValueError("not a canonical numeral: %r" % s)
    return total
'''
tests = '''
check(lambda: roman_to_int("MCMXCIV"), 1994)
check(lambda: roman_to_int("III"), 3)
check(lambda: roman_to_int("XLII"), 42)
check(lambda: roman_to_int("MMMCMXCIX"), 3999)
check(lambda: roman_to_int("CDXLIV"), 444)
check(lambda: roman_to_int("I"), 1)
check(lambda: roman_to_int("DCCCXC"), 890)
for bad in ["", "IIII", "IC", "VX", "MMMM", "IL", "XM", "VV", "LL", "DD", "IIV", "IXI", "iv", "XCX", "CMC", "MCMC", "ABC", "IVI"]:
    check_raises((lambda b=bad: roman_to_int(b)), ValueError, label=repr(bad))
'''

[[task]]
id = "cg09"
entry = "count_paths"
prompt = '''
Write a Python function `count_paths(grid: list[str]) -> int`.

`grid` is a non-empty list of equal-length, non-empty strings made of "." (open) and "#" (blocked). Count the paths from the top-left cell to the bottom-right cell that move only right or down and only through open cells. Return the count modulo 1_000_000_007. If the start or end cell is blocked, return 0. A 1x1 open grid has exactly one path.

Example:
count_paths(["...", ".#.", "..."]) == 2
'''
reference = '''
def count_paths(grid):
    mod = 1_000_000_007
    rows, cols = len(grid), len(grid[0])
    dp = [0] * cols
    for r in range(rows):
        for c in range(cols):
            if grid[r][c] == "#":
                dp[c] = 0
            elif r == 0 and c == 0:
                dp[c] = 1
            else:
                dp[c] = (dp[c] + (dp[c - 1] if c > 0 else 0)) % mod
    return dp[-1]
'''
tests = '''
import math
check(lambda: count_paths(["...", ".#.", "..."]), 2)
check(lambda: count_paths(["."]), 1)
check(lambda: count_paths(["#"]), 0)
check(lambda: count_paths(["..", ".."]), 2)
check(lambda: count_paths(["..#", "...", "#.."]), 4)
check(lambda: count_paths([".#", "#."]), 0)
check(lambda: count_paths(["...."]), 1)
check(lambda: count_paths(["..", "#."]), 1)
check(lambda: count_paths(["...", "...", "..#"]), 0)
check(lambda: count_paths(["." * 60] * 60), math.comb(118, 59) % 1_000_000_007)
check(lambda: count_paths(["." * 300] * 300), math.comb(598, 299) % 1_000_000_007)
'''

[[task]]
id = "cg10"
entry = "format_table"
lite = true
prompt = '''
Write a Python function `format_table(rows: list[list[str]], align: str) -> str`.

`rows` has at least one row; every row has len(align) cells. Each character of `align` is "l" (left), "r" (right) or "c" (center) for that column.
- A column's width is the length of its longest cell.
- Pad cells with spaces to the column width. For "c", split the padding evenly; when it is odd, the extra space goes on the right.
- Join the cells of a row with " | ".
- After the first row (the header), add a separator line: for each column, that many "-" characters, joined with "-+-".
- Remove trailing spaces from every line, and join the lines with "\n" (no newline at the end).

Example:
format_table([["name", "qty"], ["apple", "3"], ["fig", "12"]], "lr") ==
"name  | qty\n------+----\napple |   3\nfig   |  12"
'''
reference = '''
def format_table(rows, align):
    widths = [max(len(r[i]) for r in rows) for i in range(len(align))]

    def pad(cell, width, how):
        extra = width - len(cell)
        if how == "l":
            return cell + " " * extra
        if how == "r":
            return " " * extra + cell
        left = extra // 2
        return " " * left + cell + " " * (extra - left)

    lines = []
    for idx, row in enumerate(rows):
        lines.append(" | ".join(pad(c, w, a) for c, w, a in zip(row, widths, align)).rstrip())
        if idx == 0:
            lines.append("-+-".join("-" * w for w in widths))
    return "\n".join(lines)
'''
tests = '''
check(lambda: format_table([["name", "qty"], ["apple", "3"], ["fig", "12"]], "lr"), "name  | qty\n------+----\napple |   3\nfig   |  12")
check(lambda: format_table([["a"]], "l"), "a\n-")
check(lambda: format_table([["h1", "h2"]], "rl"), "h1 | h2\n---+---")
check(lambda: format_table([["x", "y"], ["long", "z"]], "cl"), " x   | y\n-----+--\nlong | z")
check(lambda: format_table([["id", "name"], ["1", "Al"], ["22", "Bea"]], "cc"), "id | name\n---+-----\n1  |  Al\n22 | Bea")
