check(lambda: chunked([1, 2], 5), [[1, 2]])
check(lambda: chunked([1, 2, 3, 4], 1), [[1], [2], [3], [4]])
check_raises(lambda: chunked([1, 2], 0), ValueError)
check_raises(lambda: chunked([1, 2], -1), ValueError)
'''

