id = "fcg08"
entry = "next_run"
lite = true
prompt = '''
Write a Python function `next_run(spec: str, after: int) -> int` for a tiny cron-like schedule.

`spec` has exactly two fields separated by a single space, "MINUTE HOUR". Each field is one of:
- "*" (every value),
- "*/n" (every n-th value starting at 0, n >= 1),
- a number,
- a range "a-b" (inclusive, a <= b),
- or a comma-separated list of numbers and ranges (for example "0,15,30-35").
Minutes are 0-59 and hours are 0-23.

`after` is a minute of the day (0-1439). Return the first minute strictly after `after` that matches both fields, counted from the start of the current day; if the next match is on the following day, the result is >= 1440 (for example 1440 + 30 for 00:30 tomorrow). Raise ValueError for a malformed spec or out-of-range values.

Examples:
next_run("30 *", 0) == 30
next_run("0 9", 540) == 1440 + 540
next_run("*/15 10-11", 600) == 615
'''
reference = '''
import re

def _field(text, lo, hi):
    if text == "*":
        return set(range(lo, hi + 1))
    m = re.fullmatch(r"\*/([0-9]+)", text)
    if m:
        n = int(m.group(1))
        if n < 1:
            raise ValueError("step must be >= 1")
        return set(range(lo, hi + 1, n))
    out = set()
    for part in text.split(","):
        m = re.fullmatch(r"([0-9]+)(?:-([0-9]+))?", part)
        if not m:
            raise ValueError("bad field part %r" % part)
        a = int(m.group(1))
        b = int(m.group(2)) if m.group(2) is not None else a
        if a > b or a < lo or b > hi:
            raise ValueError("value out of range")
        out.update(range(a, b + 1))
    return out

def next_run(spec, after):
    parts = spec.split(" ")
    if len(parts) != 2:
        raise ValueError("expected MINUTE HOUR")
    minutes = _field(parts[0], 0, 59)
    hours = _field(parts[1], 0, 23)
    for t in range(after + 1, after + 1 + 2 * 1440):
        day_minute = t % 1440
        if day_minute // 60 in hours and day_minute % 60 in minutes:
            return t
    raise ValueError("no match")
'''
tests = '''
check(lambda: next_run("30 *", 0), 30)
check(lambda: next_run("0 9", 540), 1980)
check(lambda: next_run("0 9", 539), 540)
check(lambda: next_run("*/15 10-11", 600), 615)
check(lambda: next_run("*/15 10-11", 705), 2040)
check(lambda: next_run("* *", 1439), 1440)
check(lambda: next_run("5,10 0", 5), 10)
check(lambda: next_run("0,15,30-32 1", 91), 92)
check(lambda: next_run("59 23", 0), 1439)
check(lambda: next_run("*/25 *", 50), 60)
for bad in ["60 *", "* 24", "*/0 *", "5-3 *", "*", "1,,2 *", "a *", "* * *", "-1 *"]:
    check_raises((lambda b=bad: next_run(b, 0)), ValueError, label=repr(bad))
'''

