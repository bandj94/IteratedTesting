id = "fcg02"
entry = "allow_requests"
prompt = '''
Write a Python function `allow_requests(timestamps: list[float], limit: int, window: float) -> list[bool]` for a sliding-window rate limiter.

Requests arrive at the given times, in non-decreasing order. A request at time t is allowed if fewer than `limit` previously *allowed* requests have times in the half-open interval (t - window, t]. Rejected requests do not count. Return one boolean per request.

Example:
allow_requests([0, 0.5, 1, 2.5], 2, 2) == [True, True, False, True]
'''
reference = '''
from collections import deque

def allow_requests(timestamps, limit, window):
    allowed = deque()
    out = []
    for t in timestamps:
        while allowed and allowed[0] <= t - window:
            allowed.popleft()
        if len(allowed) < limit:
            allowed.append(t)
            out.append(True)
        else:
            out.append(False)
    return out
'''
