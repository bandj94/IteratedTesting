id = "fcg04"
entry = "bowling_score"
prompt = '''
Write a Python function `bowling_score(rolls: list[int]) -> int` that scores one complete game of ten-pin bowling.

- A game has 10 frames. In frames 1-9, a strike (10 pins on the first roll) ends the frame; otherwise the frame has two rolls whose sum is at most 10.
- A strike scores 10 plus the next two rolls. A spare (two rolls summing to 10) scores 10 plus the next roll.
- Frame 10: if it starts with a strike or is a spare, it has a third roll; otherwise it has two rolls. After a strike in frame 10, if the second roll is not a strike, the second and third rolls together must be at most 10.

Validate the input: every roll is an int from 0 to 10, the pin counts within each frame are possible, and the number of rolls is exactly right for one complete game. Raise ValueError otherwise.

Examples: twelve strikes score 300; twenty zeros score 0.
'''
reference = '''
def bowling_score(rolls):
    for r in rolls:
        if not isinstance(r, int) or isinstance(r, bool) or not 0 <= r <= 10:
            raise ValueError("invalid roll %r" % (r,))
    frames, i = [], 0
    for _ in range(9):
        if i >= len(rolls):
            raise ValueError("too few rolls")
        if rolls[i] == 10:
            frames.append([10])
            i += 1
        else:
            if i + 1 >= len(rolls):
                raise ValueError("too few rolls")
            if rolls[i] + rolls[i + 1] > 10:
                raise ValueError("too many pins in a frame")
            frames.append(rolls[i:i + 2])
            i += 2
    last = rolls[i:]
    if len(last) < 2:
        raise ValueError("too few rolls")
    a, b = last[0], last[1]
    if a == 10 or a + b == 10:
        if len(last) != 3:
            raise ValueError("frame 10 needs exactly three rolls")
        if a == 10 and b != 10 and b + last[2] > 10:
            raise ValueError("too many pins in frame 10")
    else:
        if a + b > 10:
            raise ValueError("too many pins in frame 10")
        if len(last) != 2:
            raise ValueError("frame 10 needs exactly two rolls")
    score, i = 0, 0
    for f in frames:
        if f == [10]:
            score += 10 + rolls[i + 1] + rolls[i + 2]
            i += 1
        elif sum(f) == 10:
            score += 10 + rolls[i + 2]
            i += 2
        else:
            score += sum(f)
            i += 2
    return score + sum(last)
'''
tests = '''
