symptom = "rotate_list([1, 2, 3], 7) returns [1, 2, 3], but it should return [3, 1, 2]."
code = '''
def rotate_list(items, k):
    """Return a new list with items rotated right by k positions. k may be negative (rotate left)
    and may be larger than the length of the list."""
    if k > len(items):
        k = k - len(items)
    return items[-k:] + items[:-k]
'''
reference = '''
def rotate_list(items, k):
    """Return a new list with items rotated right by k positions."""
    if not items:
        return []
    k %= len(items)
    return items[-k:] + items[:-k] if k else list(items)
'''
tests = '''
check(lambda: rotate_list([1, 2, 3], 7), [3, 1, 2])
check(lambda: rotate_list([1, 2, 3], 1), [3, 1, 2])
check(lambda: rotate_list([1, 2, 3], -1), [2, 3, 1])
check(lambda: rotate_list([1, 2, 3], -5), [3, 1, 2])
check(lambda: rotate_list([1, 2, 3], 0), [1, 2, 3])
check(lambda: rotate_list([1, 2, 3], 3), [1, 2, 3])
check(lambda: rotate_list([], 4), [])
check(lambda: rotate_list([1, 2, 3, 4], 10), [3, 4, 1, 2])
check(lambda: (lambda l: rotate_list(l, 0) is not l)([1, 2]), True)
'''

