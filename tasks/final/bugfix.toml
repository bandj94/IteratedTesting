code = '''
def count_islands(grid):
    """Count groups of "#" cells that are connected horizontally or vertically (not diagonally).
    grid is a list of equal-length strings. An empty grid ([] or rows of length 0) has 0 islands."""
    rows, cols = len(grid), len(grid[0])
    seen = set()
    count = 0
    for r in range(rows):
        for c in range(cols):
            if grid[r][c] == "#" and (r, c) not in seen:
                count += 1
                stack = [(r, c)]
                while stack:
                    y, x = stack.pop()
                    seen.add((y, x))
                    for dy in (-1, 0, 1):
                        for dx in (-1, 0, 1):
                            ny, nx = y + dy, x + dx
                            if 0 <= ny < rows and 0 <= nx < cols and grid[ny][nx] == "#" and (ny, nx) not in seen:
                                stack.append((ny, nx))
    return count
'''
reference = '''
def count_islands(grid):
    """Count groups of "#" cells that are connected horizontally or vertically (not diagonally)."""
    if not grid or not grid[0]:
        return 0
    rows, cols = len(grid), len(grid[0])
    seen = set()
    count = 0
    for r in range(rows):
        for c in range(cols):
            if grid[r][c] == "#" and (r, c) not in seen:
                count += 1
                seen.add((r, c))
                stack = [(r, c)]
                while stack:
                    y, x = stack.pop()
                    for dy, dx in ((1, 0), (-1, 0), (0, 1), (0, -1)):
                        ny, nx = y + dy, x + dx
                        if 0 <= ny < rows and 0 <= nx < cols and grid[ny][nx] == "#" and (ny, nx) not in seen:
                            seen.add((ny, nx))
                            stack.append((ny, nx))
    return count
'''
tests = '''
check(lambda: count_islands(["#.", ".#"]), 2)
check(lambda: count_islands([]), 0)
check(lambda: count_islands(["", ""]), 0)
check(lambda: count_islands(["###", "#.#", "###"]), 1)
check(lambda: count_islands(["#.#", ".#.", "#.#"]), 5)
check(lambda: count_islands(["....", "...."]), 0)
check(lambda: count_islands(["##..", "##..", "..##"]), 2)
check(lambda: count_islands(["#" * 50] * 50), 1)
'''

