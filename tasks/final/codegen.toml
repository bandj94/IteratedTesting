check(lambda: bowling_score([0] * 20), 0)
check(lambda: bowling_score([5, 5] * 10 + [5]), 150)
check(lambda: bowling_score([9, 0] * 10), 90)
check(lambda: bowling_score([10, 7, 3, 9, 0, 10, 0, 8, 8, 2, 0, 6, 10, 10, 10, 8, 1]), 167)
check(lambda: bowling_score([0] * 18 + [10, 10, 10]), 30)
