symptom = "chunked([1, 2, 3, 4, 5], 2) returns [[1, 2], [3, 4]] instead of [[1, 2], [3, 4], [5]]."
code = '''
def chunked(items, size):
    """Split the list items into consecutive chunks of length size; the last chunk may be shorter.
    size must be >= 1, otherwise raise ValueError."""
    chunks = []
    for i in range(0, len(items) - size + 1, size):
        chunks.append(items[i:i + size])
    return chunks
'''
reference = '''
def chunked(items, size):
    """Split the list items into consecutive chunks of length size; the last chunk may be shorter.
    size must be >= 1, otherwise raise ValueError."""
    if size < 1:
        raise ValueError("size must be >= 1")
    return [items[i:i + size] for i in range(0, len(items), size)]
'''
