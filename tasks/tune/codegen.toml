Write a Python function `wrap_text(text: str, width: int) -> list[str]` (width >= 1).

Split `text` into words on any whitespace. A word longer than `width` is first cut into pieces of exactly `width` characters (the last piece may be shorter); each piece is then treated as a separate word.

Fill lines greedily: keep adding words to the current line, separated by single spaces, while the line length stays <= width; otherwise start a new line. Return the list of lines. Text with no words returns [].

Examples:
wrap_text("the quick brown fox", 10) == ["the quick", "brown fox"]
wrap_text("abcdefghij xy", 4) == ["abcd", "efgh", "ij", "xy"]
'''
reference = '''
def wrap_text(text, width):
    words = []
    for w in text.split():
        while len(w) > width:
            words.append(w[:width])
            w = w[width:]
        if w:
            words.append(w)
    lines, cur = [], ""
    for w in words:
        if not cur:
            cur = w
        elif len(cur) + 1 + len(w) <= width:
            cur += " " + w
        else:
            lines.append(cur)
            cur = w
    if cur:
        lines.append(cur)
    return lines
'''
