[[task]]
id = "bf01"
entry = "find_first"
symptom = "find_first([1, 2, 2, 2, 3], 2) returns 2, but it should return 1."
code = '''
def find_first(items, target):
    """Return the index of the first occurrence of target in the sorted list items, or -1 if it is absent."""
    lo, hi = 0, len(items) - 1
    while lo <= hi:
        mid = (lo + hi) // 2
        if items[mid] < target:
            lo = mid + 1
        elif items[mid] > target:
            hi = mid - 1
        else:
            return mid
    return -1
'''
reference = '''
def find_first(items, target):
    """Return the index of the first occurrence of target in the sorted list items, or -1 if it is absent."""
    lo, hi = 0, len(items)
    while lo < hi:
        mid = (lo + hi) // 2
        if items[mid] < target:
            lo = mid + 1
        else:
            hi = mid
    return lo if lo < len(items) and items[lo] == target else -1
'''
tests = '''
import random as _random
check(lambda: find_first([1, 2, 2, 2, 3], 2), 1)
check(lambda: find_first([], 5), -1)
check(lambda: find_first([5, 5, 5], 5), 0)
check(lambda: find_first([1, 3, 5], 4), -1)
check(lambda: find_first([1, 3, 5], 6), -1)
check(lambda: find_first([1, 3, 5], 0), -1)
check(lambda: find_first([1, 1, 2, 2, 2, 2, 3, 3, 9], 3), 6)
check(lambda: find_first([0] * 1000 + [1] * 1000, 1), 1000)
_rng = _random.Random(3)
for _case in range(25):
    _items = sorted(_rng.randint(0, 6) for _ in range(_rng.randint(0, 15)))
    _t = _rng.randint(0, 7)
    check((lambda it=_items, t=_t: find_first(it, t)), _items.index(_t) if _t in _items else -1, label="random %d" % _case)
'''

