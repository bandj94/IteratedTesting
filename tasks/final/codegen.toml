[[task]]
id = "fcg01"
entry = "resolve_pointer"
lite = true
prompt = '''
Write a Python function `resolve_pointer(doc, pointer: str)` that implements JSON Pointer lookup (RFC 6901) on nested Python dicts and lists.

- The pointer "" refers to the whole document.
- Otherwise the pointer must start with "/" and is split on "/" into reference tokens. In each token, "~1" means "/" and "~0" means "~" (replace "~1" first, then "~0", so "~01" means "~1"). A "~" that is not followed by "0" or "1" is invalid.
- For a dict, the token is a key. For a list, the token must be a base-10 index without leading zeros ("0" itself is fine) that is within range.
- Raise ValueError if the pointer is malformed (does not start with "/", or has a bad "~" escape), KeyError if a dict key is missing, IndexError if a list token is not a valid index or is out of range, and TypeError if a token is applied to a value that is neither a dict nor a list.

Examples:
resolve_pointer({"a": {"b": [10, 20]}}, "/a/b/1") == 20
resolve_pointer({"x/y": 2}, "/x~1y") == 2
'''
reference = '''
import re

def resolve_pointer(doc, pointer):
    if pointer == "":
        return doc
    if not pointer.startswith("/"):
        raise ValueError("a pointer must start with /")
    cur = doc
    for raw in pointer[1:].split("/"):
        if re.search(r"~(?![01])", raw):
            raise ValueError("bad ~ escape in %r" % raw)
        token = raw.replace("~1", "/").replace("~0", "~")
        if isinstance(cur, dict):
            if token not in cur:
                raise KeyError(token)
            cur = cur[token]
        elif isinstance(cur, list):
            if not re.fullmatch(r"0|[1-9][0-9]*", token) or int(token) >= len(cur):
                raise IndexError(token)
            cur = cur[int(token)]
        else:
            raise TypeError("cannot index into %s" % type(cur).__name__)
    return cur
'''
tests = '''
doc = {"a": {"b": [10, 20, {"c": "x"}]}, "m~n": 1, "x/y": 2, "": 3, "arr": []}
check(lambda: resolve_pointer(doc, ""), doc)
check(lambda: resolve_pointer(doc, "/a/b/1"), 20)
check(lambda: resolve_pointer(doc, "/a/b/2/c"), "x")
check(lambda: resolve_pointer(doc, "/m~0n"), 1)
check(lambda: resolve_pointer(doc, "/x~1y"), 2)
check(lambda: resolve_pointer(doc, "/"), 3)
check(lambda: resolve_pointer({"~1": 5}, "/~01"), 5)
check(lambda: resolve_pointer({"0": "s"}, "/0"), "s")
check(lambda: resolve_pointer([[1, 2], [3]], "/1/0"), 3)
check_raises(lambda: resolve_pointer(doc, "a"), ValueError)
check_raises(lambda: resolve_pointer(doc, "/a/b/01"), IndexError)
check_raises(lambda: resolve_pointer(doc, "/a/b/3"), IndexError)
check_raises(lambda: resolve_pointer(doc, "/a/b/-1"), IndexError)
check_raises(lambda: resolve_pointer(doc, "/a/b/x"), IndexError)
check_raises(lambda: resolve_pointer(doc, "/arr/0"), IndexError)
check_raises(lambda: resolve_pointer(doc, "/zzz"), KeyError)
check_raises(lambda: resolve_pointer(doc, "/a/~2"), ValueError)
check_raises(lambda: resolve_pointer(doc, "/m~"), ValueError)
check_raises(lambda: resolve_pointer(doc, "/a/b/2/c/d"), TypeError)
'''

