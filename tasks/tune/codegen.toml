prompt = '''
Write a Python function `min_window(s: str, t: str) -> str`.

Return the shortest contiguous substring of `s` that contains every character of `t`, counting multiplicity (if `t` has two "a"s, the window needs at least two "a"s). If several shortest windows exist, return the leftmost one. If no window exists, or `t` is empty, return "". Both strings can be up to 100000 characters long, so the solution must run in about linear time.

Example:
min_window("ADOBECODEBANC", "ABC") == "BANC"
'''
reference = '''
from collections import Counter

def min_window(s, t):
    if not t:
        return ""
    need = Counter(t)
    missing = len(t)
    left = 0
    best = None
    for right, ch in enumerate(s, 1):
        if need[ch] > 0:
            missing -= 1
        need[ch] -= 1
        if missing == 0:
            while need[s[left]] < 0:
                need[s[left]] += 1
                left += 1
            if best is None or right - left < best[1] - best[0]:
                best = (left, right)
            need[s[left]] += 1
            missing += 1
            left += 1
    return s[best[0]:best[1]] if best else ""
'''
