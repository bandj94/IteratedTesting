prompt = '''
Write a Python function `group_anagrams(words: list[str]) -> list[list[str]]`.

Two words are anagrams if they contain the same letters with the same counts, ignoring case. Group the words, keeping each word exactly as given (including duplicates). Sort the words inside each group with plain string comparison. Sort the groups by size, largest first, and break ties by the group's first word (after sorting the group). Return the list of groups.

Example:
group_anagrams(["Listen", "silent", "enlist", "google", "gogole", "cat"]) == [["Listen", "enlist", "silent"], ["gogole", "google"], ["cat"]]
'''
reference = '''
def group_anagrams(words):
    groups = {}
    for w in words:
        groups.setdefault("".join(sorted(w.lower())), []).append(w)
    result = [sorted(g) for g in groups.values()]
    result.sort(key=lambda g: (-len(g), g[0]))
    return result
'''
