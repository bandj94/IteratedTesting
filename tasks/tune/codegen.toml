id = "cg06"
entry = "assign_rooms"
prompt = '''
Write a Python function `assign_rooms(meetings: list[tuple[str, int, int]]) -> dict[str, int]`.

Each meeting is (name, start, end) with start < end and covers the half-open interval [start, end). Rooms are numbered 1, 2, 3, ...

Process meetings in order of start time; meetings with the same start time are processed in alphabetical order of name. Give each meeting the lowest-numbered room that is free at its start time (a room is free if every meeting already placed in it has end <= this start). Open a new room only when no existing room is free.

Return a dict mapping each meeting name to its room number. Names are unique.

Example:
assign_rooms([("a", 0, 30), ("b", 5, 10), ("c", 15, 20), ("d", 10, 15)]) == {"a": 1, "b": 2, "d": 2, "c": 2}
'''
reference = '''
def assign_rooms(meetings):
    room_end = []
    result = {}
    for name, start, end in sorted(meetings, key=lambda m: (m[1], m[0])):
        for i, e in enumerate(room_end):
            if e <= start:
                room_end[i] = end
                result[name] = i + 1
                break
        else:
            room_end.append(end)
            result[name] = len(room_end)
    return result
'''
tests = '''
