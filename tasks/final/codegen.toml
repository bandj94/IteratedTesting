id = "fcg09"
entry = "diff_dicts"
prompt = '''
Write a Python function `diff_dicts(old: dict, new: dict) -> list[str]` that describes the changes between two nested dicts (string keys; values may be dicts or other JSON-like values) using dotted key paths:
- "+path" for a key that exists only in new,
- "-path" for a key that exists only in old,
- "~path: OLD -> NEW" for a key whose value changed, where OLD and NEW are written with repr().

If a key holds a dict in both old and new, recurse into it instead of reporting it as changed. If it holds a dict on only one side, report a change of the whole value. A key that exists on only one side is reported once, even if its value is a dict. Return the lines sorted by path (plain string order of the dotted path, without the leading symbol).

Example:
diff_dicts({"a": 1, "b": {"c": 2, "d": 3}}, {"a": 1, "b": {"c": 5}, "e": 0}) == ["~b.c: 2 -> 5", "-b.d", "+e"]
'''
reference = '''
def diff_dicts(old, new):
    out = []

    def walk(a, b, prefix):
        for k in set(a) | set(b):
            path = prefix + str(k)
            if k not in b:
                out.append((path, "-" + path))
            elif k not in a:
                out.append((path, "+" + path))
            elif isinstance(a[k], dict) and isinstance(b[k], dict):
                walk(a[k], b[k], path + ".")
            elif a[k] != b[k]:
                out.append((path, "~%s: %r -> %r" % (path, a[k], b[k])))

    walk(old, new, "")
    return [line for _, line in sorted(out)]
'''
tests = '''
check(lambda: diff_dicts({"a": 1, "b": {"c": 2, "d": 3}}, {"a": 1, "b": {"c": 5}, "e": 0}), ["~b.c: 2 -> 5", "-b.d", "+e"])
check(lambda: diff_dicts({}, {}), [])
check(lambda: diff_dicts({"x": 1}, {"x": 1}), [])
check(lambda: diff_dicts({"x": {"y": 1}}, {"x": 5}), ["~x: {'y': 1} -> 5"])
check(lambda: diff_dicts({"s": "a"}, {"s": "b"}), ["~s: 'a' -> 'b'"])
check(lambda: diff_dicts({"a": {"b": {"c": 1}}}, {"a": {"b": {"c": 1, "d": 2}}}), ["+a.b.d"])
check(lambda: diff_dicts({"k": [1, 2]}, {"k": [1, 2, 3]}), ["~k: [1, 2] -> [1, 2, 3]"])
check(lambda: diff_dicts({"b": 1, "a": 2}, {}), ["-a", "-b"])
check(lambda: diff_dicts({}, {"a1": 0, "a": {"b": 0}}), ["+a", "+a1"])
check(lambda: diff_dicts({"a": {"z": 1, "b": 2}}, {"a": {"z": 2, "b": 2, "c": {}}}), ["+a.c", "~a.z: 1 -> 2"])
'''

