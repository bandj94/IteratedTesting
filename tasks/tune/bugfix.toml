id = "bf03"
entry = "dedupe"
code = '''
def dedupe(items):
    """Return a new list without duplicates, keeping the first occurrence of each item in its original
    order. Items may be unhashable (for example lists or dicts). Two items are duplicates if they are
    equal (==)."""
    return list(set(items))
'''
reference = '''
def dedupe(items):
    """Return a new list without duplicates, keeping the first occurrence of each item in its original
    order. Items may be unhashable (for example lists or dicts). Two items are duplicates if they are
    equal (==)."""
    out = []
    seen = set()
    for item in items:
        try:
            if item in seen:
                continue
            seen.add(item)
        except TypeError:
            if any(item == other for other in out):
                continue
        out.append(item)
    return out
'''
tests = '''
