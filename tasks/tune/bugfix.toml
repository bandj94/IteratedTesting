entry = "moving_average"
lite = true
symptom = "moving_average([1, 2, 3], 3) returns [] instead of [2.0]."
code = '''
def moving_average(values, window):
    """Return the averages of every full window of `window` consecutive values (window >= 1).
    For n values there are n - window + 1 averages; if window > n, return []."""
    result = []
    for i in range(len(values) - window):
        chunk = values[i:i + window]
        result.append(sum(chunk) / window)
    return result
'''
reference = '''
def moving_average(values, window):
    """Return the averages of every full window of `window` consecutive values (window >= 1).
    For n values there are n - window + 1 averages; if window > n, return []."""
    result = []
    for i in range(len(values) - window + 1):
        result.append(sum(values[i:i + window]) / window)
    return result
'''
