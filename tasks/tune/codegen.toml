prompt = '''
Write a Python function `lru_simulate(capacity: int, ops: list[tuple]) -> list[int]` that simulates a least-recently-used cache.

Each op is either ("get", key) or ("put", key, value):
- get: if key is present it becomes the most recently used and its value is appended to the output; otherwise -1 is appended.
- put: insert or update key with value; key becomes the most recently used. If the cache then holds more than `capacity` keys, remove the least recently used key.
- capacity can be 0, in which case nothing is ever stored.

Return the list of outputs of all get operations, in order.
'''
reference = '''
from collections import OrderedDict

def lru_simulate(capacity, ops):
    cache = OrderedDict()
    out = []
    for op in ops:
        if op[0] == "get":
            key = op[1]
            if key in cache:
                cache.move_to_end(key)
                out.append(cache[key])
            else:
                out.append(-1)
        else:
            _, key, value = op
            if capacity <= 0:
                continue
            cache[key] = value
            cache.move_to_end(key)
            if len(cache) > capacity:
                cache.popitem(last=False)
    return out
'''
