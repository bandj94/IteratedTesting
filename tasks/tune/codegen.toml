prompt = '''
Write a Python function `apply_ledger(lines: list[str]) -> dict[str, str]`.

Each line is one of:
- "deposit NAME AMOUNT"
- "withdraw NAME AMOUNT"
- "transfer FROM TO AMOUNT"

NAME is a lowercase word. AMOUNT is a non-negative decimal number with at most two digits after the point (for example "12", "0.5" or "3.25").

All accounts start at 0. Apply the lines in order. A withdraw or transfer that would make the paying account's balance negative is skipped entirely. Arithmetic must be exact (no floating-point rounding errors).

Return a dict with every account name that appears in any line (even if all of its operations were skipped), mapped to its final balance formatted with exactly two decimals, for example "12.50". The dict's keys must be in alphabetical order.

Example:
apply_ledger(["deposit alice 10", "transfer alice bob 2.5", "withdraw bob 3"]) == {"alice": "7.50", "bob": "2.50"}
'''
reference = '''
from decimal import Decimal

def apply_ledger(lines):
    bal = {}
    for line in lines:
        parts = line.split()
        if parts[0] == "deposit":
            _, name, amt = parts
            bal.setdefault(name, Decimal(0))
            bal[name] += Decimal(amt)
        elif parts[0] == "withdraw":
            _, name, amt = parts
            bal.setdefault(name, Decimal(0))
            a = Decimal(amt)
            if bal[name] - a >= 0:
                bal[name] -= a
        elif parts[0] == "transfer":
            _, src, dst, amt = parts
            bal.setdefault(src, Decimal(0))
            bal.setdefault(dst, Decimal(0))
            a = Decimal(amt)
            if bal[src] - a >= 0:
                bal[src] -= a
                bal[dst] += a
        else:
            raise ValueError("unknown operation %r" % parts[0])
    return {name: "%.2f" % bal[name] for name in sorted(bal)}
'''
