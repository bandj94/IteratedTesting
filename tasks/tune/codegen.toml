prompt = '''
Write a Python function `normalize_path(path: str) -> str` for POSIX-style paths (separator "/").

- Collapse repeated slashes into one, including a leading "//" (which becomes "/").
- Remove "." segments.
- A ".." segment removes the previous real segment. In an absolute path, ".." at the root is dropped ("/.." is "/"). In a relative path, a ".." that cannot be resolved is kept ("../a/../.." is "../..").
- Remove any trailing slash, except for the root "/" itself.
- If a relative path becomes empty, return ".".

Examples:
normalize_path("/a//b/./c/..") == "/a/b"
normalize_path("a/../../b") == "../b"
normalize_path("//x") == "/x"
'''
reference = '''
def normalize_path(path):
    absolute = path.startswith("/")
    out = []
    for seg in path.split("/"):
        if seg in ("", "."):
            continue
        if seg == "..":
            if out and out[-1] != "..":
                out.pop()
            elif not absolute:
                out.append("..")
            continue
        out.append(seg)
    if absolute:
        return "/" + "/".join(out)
    return "/".join(out) or "."
'''
tests = '''
check(lambda: normalize_path("/a//b/./c/.."), "/a/b")
check(lambda: normalize_path("a/../../b"), "../b")
check(lambda: normalize_path("//x"), "/x")
check(lambda: normalize_path("/"), "/")
check(lambda: normalize_path(""), ".")
check(lambda: normalize_path("."), ".")
check(lambda: normalize_path("/../.."), "/")
check(lambda: normalize_path("../a/../.."), "../..")
check(lambda: normalize_path("a/b/"), "a/b")
check(lambda: normalize_path("///a///b///"), "/a/b")
check(lambda: normalize_path("a/./b/../../c/."), "c")
check(lambda: normalize_path("a/.."), ".")
check(lambda: normalize_path("./../x"), "../x")
check(lambda: normalize_path("/a/b/../../../c"), "/c")
check(lambda: normalize_path("..."), "...")
check(lambda: normalize_path("a/.../b"), "a/.../b")
'''
