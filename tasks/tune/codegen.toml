id = "cg04"
entry = "top_words"
prompt = '''
Write a Python function `top_words(text: str, k: int) -> list[str]`.

A word is a maximal run of ASCII letters (a-z, A-Z) and apostrophes; after finding a run, strip leading and trailing apostrophes from it, and ignore it if nothing is left. Compare words case-insensitively and return them in lowercase.

Return the k most frequent words, most frequent first. Break ties by the position of each word's first occurrence in the text (earlier first). If there are fewer than k distinct words, return all of them. k is >= 0.

Examples:
top_words("The cat and the hat. THE end, cat!", 2) == ["the", "cat"]
top_words("'Tis the season, isn't it? 'tis!", 1) == ["tis"]
'''
reference = '''
import re

def top_words(text, k):
    counts, first = {}, {}
    for i, raw in enumerate(re.findall(r"[A-Za-z']+", text)):
        w = raw.strip("'").lower()
        if not w:
            continue
        if w not in counts:
            counts[w] = 0
            first[w] = i
        counts[w] += 1
    return sorted(counts, key=lambda w: (-counts[w], first[w]))[:k]
'''
tests = '''
