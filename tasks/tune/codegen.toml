prompt = '''
Write a Python function `free_slots(busy_a: list[tuple[str, str]], busy_b: list[tuple[str, str]], min_minutes: int) -> list[tuple[str, str]]`.

Times are "HH:MM" strings (24-hour clock). Each busy interval (start, end) is half-open [start, end). Intervals may overlap, be unsorted, have zero length, or extend outside the working day.

Return the time ranges between "09:00" and "17:00" when both people are free, as a sorted list of (start, end) "HH:MM" tuples. Free time that touches is reported as one range. Keep only ranges that are at least `min_minutes` long (min_minutes >= 1).

Example:
free_slots([("09:30", "10:00")], [("12:00", "13:00")], 30) == [("09:00", "09:30"), ("10:00", "12:00"), ("13:00", "17:00")]
'''
reference = '''
def free_slots(busy_a, busy_b, min_minutes):
    def to_min(t):
        h, m = t.split(":")
        return int(h) * 60 + int(m)

    def fmt(v):
        return "%02d:%02d" % (v // 60, v % 60)

    start, end = 9 * 60, 17 * 60
    busy = sorted((to_min(s), to_min(e)) for s, e in list(busy_a) + list(busy_b))
    result, cur = [], start
    for s, e in busy:
        if e <= s:
            continue
        if s > cur:
            seg_end = min(s, end)
            if seg_end > cur and seg_end - cur >= min_minutes:
                result.append((fmt(cur), fmt(seg_end)))
        cur = max(cur, e)
        if cur >= end:
            break
    if cur < end and end - cur >= min_minutes:
        result.append((fmt(cur), fmt(end)))
    return result
'''
