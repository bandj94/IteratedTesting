check(lambda: top_words("'Tis the season, isn't it? 'tis!", 1), ["tis"])
check(lambda: top_words("b a b a c", 3), ["b", "a", "c"])
check(lambda: top_words("one two three", 10), ["one", "two", "three"])
check(lambda: top_words("x y z", 0), [])
check(lambda: top_words("", 3), [])
check(lambda: top_words("'' ' -- 42", 2), [])
check(lambda: top_words("Don't stop. DON'T! don't", 1), ["don't"])
check(lambda: top_words("rock'n'roll rock rock'n'roll", 2), ["rock'n'roll", "rock"])
check(lambda: top_words("e-mail e mail", 2), ["e", "mail"])
check(lambda: top_words("café cafe", 2), ["caf", "cafe"])
check(lambda: top_words("a1b2 b", 2), ["b", "a"])
'''

[[task]]
id = "cg05"
entry = "eval_rpn"
lite = true
prompt = '''
Write a Python function `eval_rpn(tokens: list[str]) -> int` that evaluates a program for a small stack machine.

Each token is either an integer literal (digits, optionally with a leading "-", e.g. "-7") or one of these operators:
- "+", "-", "*": pop b, then pop a, push a op b.
- "/": pop b, then pop a, push a divided by b truncated toward zero (so -7 / 2 is -3). Raise ZeroDivisionError if b is 0.
- "neg": pop a, push -a.
- "dup": push a copy of the top value.
- "swap": exchange the two top values.

At the end exactly one value must remain on the stack; return it. Raise ValueError for an unknown token, for an operator that needs more values than the stack holds, or if the stack does not end with exactly one value.

Examples:
eval_rpn(["3", "4", "+", "2", "*"]) == 14
eval_rpn(["-7", "2", "/"]) == -3
eval_rpn(["5", "dup", "*", "neg"]) == -25
'''
reference = '''
import re

def eval_rpn(tokens):
    stack = []

    def need(n):
        if len(stack) < n:
            raise ValueError("stack underflow")

    for tok in tokens:
        if tok in ("+", "-", "*", "/"):
            need(2)
            b = stack.pop()
            a = stack.pop()
            if tok == "+":
                stack.append(a + b)
            elif tok == "-":
                stack.append(a - b)
            elif tok == "*":
                stack.append(a * b)
            else:
                if b == 0:
                    raise ZeroDivisionError("division by zero")
                q = abs(a) // abs(b)
                stack.append(q if (a >= 0) == (b >= 0) else -q)
        elif tok == "neg":
            need(1)
            stack.append(-stack.pop())
        elif tok == "dup":
            need(1)
            stack.append(stack[-1])
        elif tok == "swap":
            need(2)
            stack[-1], stack[-2] = stack[-2], stack[-1]
        elif re.fullmatch(r"-?[0-9]+", tok):
            stack.append(int(tok))
        else:
            raise ValueError("unknown token %r" % tok)
    if len(stack) != 1:
        raise ValueError("the stack must end with exactly one value")
    return stack[0]
'''
tests = '''
check(lambda: eval_rpn(["3", "4", "+", "2", "*"]), 14)
check(lambda: eval_rpn(["-7", "2", "/"]), -3)
check(lambda: eval_rpn(["7", "-2", "/"]), -3)
check(lambda: eval_rpn(["-8", "2", "/"]), -4)
check(lambda: eval_rpn(["-9", "-2", "/"]), 4)
check(lambda: eval_rpn(["1", "3", "/"]), 0)
check(lambda: eval_rpn(["5", "dup", "*", "neg"]), -25)
check(lambda: eval_rpn(["2", "9", "swap", "-"]), 7)
check(lambda: eval_rpn(["42"]), 42)
check(lambda: eval_rpn(["10", "3", "-"]), 7)
check_raises(lambda: eval_rpn(["1", "0", "/"]), ZeroDivisionError)
check_raises(lambda: eval_rpn(["1", "+"]), ValueError)
check_raises(lambda: eval_rpn(["1", "2"]), ValueError)
check_raises(lambda: eval_rpn([]), ValueError)
check_raises(lambda: eval_rpn(["1", "2", "pow"]), ValueError)
check_raises(lambda: eval_rpn(["dup"]), ValueError)
check_raises(lambda: eval_rpn(["3", "swap"]), ValueError)
check_raises(lambda: eval_rpn(["1.5"]), ValueError)
'''

