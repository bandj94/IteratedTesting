[[task]]
id = "cg03"
entry = "bump_version"
prompt = '''
Write a Python function `bump_version(version: str, part: str) -> str`.

A version is "MAJOR.MINOR.PATCH", optionally followed by "-pre.N". MAJOR, MINOR, PATCH and N are non-negative integers written without leading zeros (a single "0" is fine), and N >= 1.

`part` is one of "major", "minor", "patch", "pre":
- "major": MAJOR+1, MINOR and PATCH reset to 0, any pre-release suffix removed.
- "minor": MINOR+1, PATCH reset to 0, suffix removed.
- "patch": if the version has a pre-release suffix, only remove the suffix (1.4.0-pre.2 -> 1.4.0); otherwise PATCH+1.
- "pre": if the version has a suffix "-pre.N", increase N by one; otherwise increase PATCH by one and add "-pre.1".

Raise ValueError for an invalid version string or an unknown part.

Examples:
bump_version("1.2.3", "minor") == "1.3.0"
bump_version("1.2.3", "pre") == "1.2.4-pre.1"
bump_version("1.2.4-pre.1", "pre") == "1.2.4-pre.2"
bump_version("1.2.4-pre.2", "patch") == "1.2.4"
'''
reference = '''
import re

def bump_version(version, part):
    m = re.fullmatch(r"(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:-pre\.([1-9][0-9]*))?", version)
    if not m:
        raise ValueError("invalid version %r" % version)
    major, minor, patch = (int(g) for g in m.groups()[:3])
    pre = int(m.group(4)) if m.group(4) else None
    if part == "major":
        return "%d.0.0" % (major + 1)
    if part == "minor":
        return "%d.%d.0" % (major, minor + 1)
    if part == "patch":
        return "%d.%d.%d" % (major, minor, patch if pre is not None else patch + 1)
    if part == "pre":
        if pre is not None:
            return "%d.%d.%d-pre.%d" % (major, minor, patch, pre + 1)
        return "%d.%d.%d-pre.1" % (major, minor, patch + 1)
    raise ValueError("unknown part %r" % part)
'''
tests = '''
check(lambda: bump_version("1.2.3", "major"), "2.0.0")
check(lambda: bump_version("1.2.3", "minor"), "1.3.0")
check(lambda: bump_version("1.2.3", "patch"), "1.2.4")
check(lambda: bump_version("1.2.3", "pre"), "1.2.4-pre.1")
check(lambda: bump_version("1.2.4-pre.1", "pre"), "1.2.4-pre.2")
check(lambda: bump_version("1.2.4-pre.9", "pre"), "1.2.4-pre.10")
check(lambda: bump_version("1.2.4-pre.2", "patch"), "1.2.4")
check(lambda: bump_version("1.2.4-pre.2", "minor"), "1.3.0")
check(lambda: bump_version("0.9.9-pre.3", "major"), "1.0.0")
check(lambda: bump_version("0.0.0", "patch"), "0.0.1")
check(lambda: bump_version("10.20.30", "minor"), "10.21.0")
for bad in ["1.2", "01.2.3", "1.02.3", "1.2.3-pre.0", "1.2.3-rc.1", "1.2.3-pre.01", "v1.2.3", "1.2.3-pre", "1.2.3.4", ""]:
    check_raises((lambda b=bad: bump_version(b, "pre")), ValueError, label=repr(bad))
check_raises(lambda: bump_version("1.2.3", "build"), ValueError)
'''

